<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>Jornada OT I08S28 | Hyperborea</title>

    <meta
      name="description"
      content="Livro antigo com efeito de página virando da Jornada OT I08S28."
    />

    <link
      rel="stylesheet"
      href="./assets/css/style.css"
    />

    <link
      rel="stylesheet"
      href="./assets/css/livro-antigo.css"
    />
  </head>

  <body class="book-body">
    <header class="site-header book-header">
      <a
        class="brand"
        href="./index.html"
        aria-label="Voltar para o portal Hyperborea"
      >
        Hyperborea
      </a>

      <nav
        class="nav"
        aria-label="Navegação principal"
      >
        <a href="./index.html">
          Portal
        </a>

        <a href="./acervo.html">
          Acervos
        </a>

        <a href="./codex.html">
          Codex
        </a>

        <a
          href="./terminal.html"
          aria-label="Buscar em Hyperborea"
        >
          Buscar
        </a>
      </nav>
    </header>

    <main class="book-main">
      <section
        class="book-intro"
        id="bookIntro"
        aria-labelledby="bookTitle"
      >
        <div
          class="closed-book"
          aria-hidden="true"
        >
          <div class="book-cover">
            <span class="cover-kicker">
              HYPERBOREA
            </span>

            <h1 id="bookTitle">
              Jornada OT I08S28
            </h1>

            <p>
              Arquivo de Travessia
            </p>
          </div>
        </div>

        <button
          class="button primary"
          id="openBookButton"
          type="button"
        >
          Abrir Livro
        </button>

        <p class="hint">
          Toque, arraste ou use os botões para virar as páginas do códice.
        </p>
      </section>

      <section
        class="book-stage hidden"
        id="bookStage"
        aria-live="polite"
        aria-label="Livro da Jornada OT I08S28"
      >
        <div class="book-toolbar">
            <button
  class="button book-search-button"
  id="bookSearchToggle"
  type="button"
  aria-label="Pesquisar no livro"
>
  🔎
</button>
          <button
            class="button"
            id="prevPage"
            type="button"
            aria-label="Voltar página"
          >
            ← Anterior
          </button>

          <span
            id="pageCounter"
            aria-live="polite"
          >
            Página 1
          </span>

          <button
            class="button"
            id="nextPage"
            type="button"
            aria-label="Avançar página"
          >
            Próxima →
          </button>
        </div>

        <div
          class="page-flip-shell"
          aria-label="Códice interativo"
        >
          <div
            class="page-flip-book"
            id="pageFlipBook"
          ></div>
        </div>
      </section>
    </main>

    <noscript>
      <p>
        Para abrir o livro interativo da Hyperborea, ative o JavaScript no navegador.
      </p>
    </noscript>

    <!-- Biblioteca do efeito real de página virando -->
    <script
      src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"
      defer
    ></script>
<script
  src="./assets/js/livro-flip.js?v=2"
  defer
></script>
  </body>
</html>
