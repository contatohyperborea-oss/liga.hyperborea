<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#20050c">

  <meta name="description"
    content="HYPERBOREA — vídeos comerciais, design e identidade visual, branding e gestão de marcas, sites e web design.">

  <meta property="og:title"
    content="HYPERBOREA | Agência Criativa">

  <meta property="og:description"
    content="Ideias que ganham identidade. Conheça nossos serviços criativos.">

  <meta property="og:image"
    content="https://liga-hyperborea.vercel.app/assets/img/boas-vindas-poster.webp?v=20261102b">

  <title>HYPERBOREA | Agência Criativa</title>

  <link rel="icon"
    href="/assets/img/monograma-h.svg?v=4"
    type="image/svg+xml">

  <style>

    :root {
      --fundo: #180409;
      --painel: #290710;
      --vinho: #650d20;
      --ouro: #e6b55d;
      --ouro-claro: #ffe5ad;
      --texto: #fff5e9;
      --suave: #ddc7bd;
      --linha: rgba(230,181,93,.36);
      --serif: Georgia, 'Times New Roman', serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--fundo);
      color: var(--texto);
      font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0 0 auto;
      height: 900px;
      pointer-events: none;
      z-index: -1;
      background: radial-gradient(
        ellipse at 30% 15%,
        #5e1021 0,
        transparent 62%
      );
    }

    img, video {
      display: block;
      max-width: 100%;
    }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible,
    button:focus-visible,
    .carrossel-faixa:focus-visible {
      outline: 3px solid var(--ouro-claro);
      outline-offset: 4px;
    }

    h1, h2, h3, p, figure {
      margin: 0;
    }

    h1, h2, h3 {
      font-family: var(--serif);
    }

    h1 {
      font-size: clamp(2.25rem, 5.5vw, 4.7rem);
      line-height: 1.08;
    }

    h2 {
      font-size: clamp(1.85rem, 4vw, 3.25rem);
      line-height: 1.14;
    }

    h3 {
      font-size: clamp(1.3rem, 2.5vw, 1.75rem);
      line-height: 1.2;
    }

    .container {
      width: min(1180px, calc(100% - 40px));
      margin-inline: auto;
    }

    .ouro {
      color: var(--ouro-claro);
    }

    .rotulo {
      color: var(--ouro);
      text-transform: uppercase;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .2em;
    }

    .subtitulo {
      color: var(--suave);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    .secao {
      padding: 88px 0;
    }

    .linha {
      border: 0;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--ouro),
        transparent
      );
    }


    /* =====================================
       CABEÇALHO HYPERBOREA
       FUNDO CHAMPANHE
       LOGOTIPO E NOME EM SVG
    ===================================== */

    .cabecalho {
      position: sticky;
      top: 0;
      z-index: 50;

      background: linear-gradient(
        110deg,
        #fff5df 0%,
        #ffe6b1 58%,
        #f6d18d 100%
      );

      border-bottom: 2px solid #b67e34;
      box-shadow: 0 5px 24px rgba(24,4,9,.25);
    }

    .cabecalho-interno {
      min-height: 84px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: relative;
    }

    /* Símbolo H à esquerda */

    .marca-simbolo {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      position: relative;
      z-index: 1;
    }

    .marca-simbolo img {
      width: 50px;
      height: 60px;
      object-fit: contain;
    }

    /* Nome HYPERBOREA centralizado */

    .marca-nome-svg {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      display: flex;
      align-items: center;
      justify-content: center;

      width: clamp(170px, 22vw, 250px);
      max-width: 42%;
    }

    .marca-nome-svg img {
      width: 100%;
      height: auto;
      max-height: 58px;
      object-fit: contain;
    }

    /* Navegação */

    .nav {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-left: auto;
    }

    .nav a {
      white-space: nowrap;
      font-size: .9rem;
      color: #650d20;
      font-weight: 600;
    }

    .nav a:hover {
      color: #9b2440;
    }

    .nav .nav-contato {
      border: 1px solid #89344a;
      padding: 9px 14px;
      border-radius: 6px;
      background: rgba(255,255,255,.26);
    }

    .menu-botao {
      display: none;
      width: 46px;
      height: 44px;
      border: 1px solid #89344a;
      border-radius: 6px;
      background: rgba(255,255,255,.32);
      color: #650d20;
      font-size: 1.3rem;
    }

    .cabecalho a:focus-visible,
    .cabecalho button:focus-visible {
      outline: 3px solid #7c0d29;
      outline-offset: 3px;
    }


    /* =====================================
       BANNER DE BOAS-VINDAS
       DESKTOP COMPACTO
       VÍDEO COM IMAGEM DE RESERVA
    ===================================== */

    .abertura {
      padding: 24px 0 42px;
    }

    .banner-video {
      position: relative;

      width: min(100%, 700px);
      aspect-ratio: 16 / 9;

      margin-inline: auto;

      overflow: hidden;
      isolation: isolate;

      background: #26050e;

      border-radius: 10px;
      border: 1px solid var(--linha);

      box-shadow: 0 18px 45px #0007;
    }

    /* Imagem fixa quando o MP4 não reproduzir */

    .banner-fallback {
      position: absolute;
      inset: 0;
      z-index: 0;

      display: flex;
      flex-direction: column;
      gap: .35rem;

      align-items: center;
      justify-content: center;

      text-align: center;
      padding: 24px;

      background:
        linear-gradient(
          130deg,
          rgba(21,3,10,.62),
          rgba(84,9,30,.18)
        ),
        url('/assets/img/boas-vindas-poster.webp?v=5')
          center / cover no-repeat,
        radial-gradient(
          ellipse at 50% 35%,
          #84203f,
          #24040c 80%
        );
    }

    .banner-fallback strong {
      font:
        700 clamp(1.3rem, 3.5vw, 2.4rem)/1.1
        Georgia, serif;

      color: #ffe6ad;
      letter-spacing: .07em;

      text-shadow: 0 2px 12px #19030e;
    }

    .banner-fallback span {
      font-size: clamp(.8rem,1.8vw,1.1rem);
      color: #fff5e9;

      text-shadow: 0 2px 10px #19030e;
    }

    /* Vídeo responsivo */

    .banner-video video {
      position: absolute;
      inset: 0;
      z-index: 1;

      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
      pointer-events: none;

      opacity: 0;
      transition: opacity .35s ease;

      background: #26050e;
    }

    /* Só exibe quando estiver reproduzindo */

    .banner-video.video-pronto video {
      opacity: 1;
    }

    .abertura-legenda {
      text-align: center;
      color: var(--suave);
      margin-top: 13px;
      font-size: .88rem;
    }


    /* =====================================
       APRESENTAÇÃO
    ===================================== */

    .apresentacao {
      max-width: 830px;
      margin-inline: auto;
      text-align: center;
    }

    .apresentacao .rotulo {
      margin-bottom: 14px;
    }

    .apresentacao h1 {
      margin-bottom: 18px;
    }

    .apresentacao p:not(.rotulo) {
      max-width: 65ch;
      color: var(--suave);
      margin-inline: auto;
    }

    .acoes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 26px;
    }

    .botao {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 47px;
      padding: 11px 19px;

      border: 1px solid var(--ouro);
      border-radius: 6px;

      font-weight: 700;
      font-size: .93rem;
      text-align: center;

      transition: transform .2s;
    }

    .botao:hover {
      transform: translateY(-2px);
    }

    .botao-ouro {
      color: #34070e;

      background: linear-gradient(
        120deg,
        #ffe7b4,
        #db9f3d
      );
    }

    .botao-vinho {
      color: var(--ouro-claro);
      background: #390a17;
    }


    /* =====================================
       CARROSSEL PEEK
       CARDS VERTICAIS 4:5
       IMAGEM COMPLETA SEM TEXTOS HTML
    ===================================== */

    .servicos {
      background: linear-gradient(
        180deg,
        transparent,
        #4d0c1a72,
        transparent
      );
    }

    .servicos-topo {
      display: flex;
      align-items: end;
      justify-content: space-between;
      flex-wrap: wrap;

      gap: 20px;
      margin-bottom: 28px;
    }

    .servicos-topo h2 {
      margin: 8px 0 10px;
    }

    .servicos-topo .subtitulo {
      max-width: 52ch;
    }

    /* Setas */

    .setas {
      display: flex;
      gap: 10px;
    }

    .seta {
      width: 46px;
      height: 46px;

      display: grid;
      place-items: center;

      border-radius: 50%;
      border: 1px solid var(--ouro);

      background: var(--painel);
      color: var(--ouro-claro);

      font-size: 1.5rem;
    }

    .seta:disabled {
      opacity: .33;
      cursor: not-allowed;
    }

    /* Trilho do carrossel */

    .carrossel-faixa {

      position: relative;

      display: flex
